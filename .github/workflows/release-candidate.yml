name: Release candidate validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify clean release workspace
        run: scripts/ci/run_rc_validation.sh preflight
      - name: Run authoritative static release validation
        run: scripts/ci/run_rc_validation.sh static

  odoo-rc:
    name: Odoo RC gates
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_PROJECT_NAME: sf_ci_rc_${{ github.run_id }}_${{ github.run_attempt }}
      CI_POSTGRES_USER: odoo
      CI_POSTGRES_PASSWORD: odoo
      CI_POSTGRES_DB: postgres
      CI_ODOO_DB_HOST: ci-db
      CI_ODOO_DB_PORT: 5432
      RC_COMPOSE_PROJECT: sf_rc_${{ github.run_id }}_${{ github.run_attempt }}
      RC_COMPOSE_RETAIN: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Compose runtime
        run: |
          docker compose version
      - name: Fresh install and federation test suite
        run: scripts/ci/run_rc_validation.sh install
      - name: Prepare upgrade database without duplicate tests
        run: scripts/ci/run_rc_validation.sh prepare-upgrade
      - name: Idempotent same-version upgrade smoke
        run: scripts/ci/run_rc_validation.sh upgrade
      - name: Complete federation suite after upgrade
        run: scripts/ci/run_rc_validation.sh full
      - name: Release performance and acceptance surfaces
        run: |
          scripts/ci/run_rc_validation.sh performance
          scripts/ci/run_rc_validation.sh acceptance
          scripts/ci/run_rc_validation.sh focus
      - name: Upload Odoo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-rc-logs
          path: |
            *.log
            artifacts/release/baseline/**/*.log
          if-no-files-found: ignore
      - name: Clean RC Compose project
        if: always()
        run: RC_COMPOSE_RETAIN=1 scripts/ci/run_rc_validation.sh cleanup

  approval-gate:
    name: RC approval gate
    if: github.event_name == 'workflow_dispatch'
    needs: odoo-rc
    runs-on: ubuntu-latest
    environment: rc-approval
    steps:
      - run: echo "Automated RC gates passed and protected environment approval was granted."
