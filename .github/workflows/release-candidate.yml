name: Release candidate validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rc-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify removed legacy engine and portal privilege inventory
        run: |
          python ci/check_legacy_engine_removed.py
          python ci/check_portal_sudo_guard.py
          python ci/check_portal_v2_ownership.py
          python ci/check_v2_officiating_contract.py
          python ci/check_v2_registration_contract.py
          python ci/check_access_csv_integrity.py
          python ci/check_source_collector_contract.py
          python ci/check_addon_integrity.py
          python ci/check_workflow_state_contracts.py
          python ci/check_phase1_fixture_contract.py
          python ci/check_phase2_rules_contract.py
          python ci/check_phases_3_5_contract.py
          python ci/check_phase51_schedule_handoff.py
          python ci/check_phases_511_53_contract.py
          python ci/check_doc_freshness.py
          python ci/check_package7_release_qualification.py
      - run: scripts/ci/run_rc_validation.sh static

  odoo-rc:
    name: Odoo RC gates
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: sf_rc_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d sf_rc_validation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: odoo
      PGPASSWORD: odoo
      DB_NAME: sf_rc_validation
      ODOO_BIN: ${{ github.workspace }}/_odoo/odoo-bin
      ADDONS_PATH: ${{ github.workspace }},${{ github.workspace }}/_odoo/addons
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: '19.0'
          path: _odoo
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: _odoo/requirements.txt
      - name: Install Odoo test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libpq-dev
          python -m pip install --upgrade pip wheel
          pip install -r _odoo/requirements.txt
      - name: Fresh install and module suites
        run: scripts/ci/run_rc_validation.sh install
      - name: Upgrade qualification
        run: scripts/ci/run_rc_validation.sh upgrade
      - name: Core, portal and public suites
        run: |
          scripts/ci/run_rc_validation.sh core
          scripts/ci/run_rc_validation.sh portal
          scripts/ci/run_rc_validation.sh public
      - name: Upload Odoo logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-rc-logs
          path: '*.log'
          if-no-files-found: ignore

  approval-gate:
    name: RC approval gate
    if: github.event_name == 'workflow_dispatch'
    needs: odoo-rc
    runs-on: ubuntu-latest
    environment: rc-approval
    steps:
      - run: echo "Automated RC gates passed and protected environment approval was granted."
